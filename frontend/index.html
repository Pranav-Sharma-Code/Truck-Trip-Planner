<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Plan truck trips under FMCSA hours-of-service rules and get filled daily log sheets." />
    <title>HOS Trip Planner</title>
    <!-- Sets the theme before the first paint so there is no flash of the wrong colours.
         Keep the storage key and the rule in step with src/lib/theme.js. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('hos-theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          theme = saved === 'light' || saved === 'dark' ? saved : dark ? 'dark' : 'light'
        } catch (error) {
          /* storage blocked: fall back to light */
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
